name: Migrate chain tables from Portal to Supabase
on: {workflow_dispatch: {}}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/migrate_portal.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARCGIS_TOKEN: ${{ secrets.ARCGIS_TOKEN }}
          ARCGIS_USER: ${{ secrets.ARCGIS_USER }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PORTAL_OWNER: ${{ vars.PORTAL_OWNER }}
